---
# ============================================================
# Sentinel Engram — Playbook 01 — Secret & Environment Management
# ============================================================
# Purpose:    Renders .env (consumed by docker compose) and writes
#             the SSH tunnel private key used by the sync worker to
#             reach Cyber Sentinel's Postgres.
#
# Depends on: templates/env.j2, group_vars/all/vault.yml.
#
# Outputs:    {{ remote_deploy_base }}/.env                  (0600)
#             {{ remote_deploy_base }}/secrets/cs_tunnel_key (0400,
#               owned by UID 10001 = sync container user)
# ============================================================

- name: 01 - Secret & Environment Management
  hosts: all_servers
  become: yes

  vars:
    remote_env_file: "{{ remote_deploy_base }}/.env"
    required_vars:
      - vault_synapse_root_password
      - vault_synapse_sync_password
      - vault_synapse_n8n_password
      - vault_synapse_analyst_password
      - vault_neo4j_password
      - vault_cs_pg_reader_password
      - vault_cs_tunnel_private_key

  tasks:
    # ============================================================
    # SECTION 0 — Required variable validation
    # ============================================================

    - name: "[01.0.1] Assert all secrets referenced by env.j2 are defined and non-empty"
      ansible.builtin.assert:
        that:
          - lookup('vars', item, default='') | string | length > 0
        fail_msg: "Required variable '{{ item }}' is missing or empty in vault.yml."
        quiet: true
      loop: "{{ required_vars }}"

    # Neo4j rejects passwords shorter than 8 characters at startup
    # and the container exits — fail here with a readable message.
    - name: "[01.0.2] Assert Neo4j password length >= 8"
      ansible.builtin.assert:
        that: vault_neo4j_password | length >= 8
        fail_msg: "vault_neo4j_password must be at least 8 characters (Neo4j requirement)."
        quiet: true

    # ============================================================
    # SECTION 1 — .env
    # ============================================================

    - name: "[01.1.1] Create base deployment directory"
      ansible.builtin.file:
        path: "{{ remote_deploy_base }}"
        state: directory
        owner: "{{ deployment_user }}"
        group: "{{ deployment_user }}"
        mode: '0755'

    - name: "[01.1.2] Generate .env from template with decrypted secrets"
      ansible.builtin.template:
        src: "templates/env.j2"
        dest: "{{ remote_env_file }}"
        owner: "{{ deployment_user }}"
        group: "{{ deployment_user }}"
        mode: '0600'
      no_log: true

    # ============================================================
    # SECTION 2 — SSH tunnel key for the sync worker
    # ------------------------------------------------------------
    # Mounted read-only into the engram-sync container. OpenSSH
    # refuses keys readable by other users, hence 0400 and owner
    # 10001 (the non-root user baked into Dockerfile.sync).
    # ============================================================

    - name: "[01.2.1] Create secrets directory"
      ansible.builtin.file:
        path: "{{ remote_deploy_base }}/secrets"
        state: directory
        owner: "10001"
        group: "10001"
        mode: '0700'

    - name: "[01.2.2] Write SSH tunnel private key"
      ansible.builtin.copy:
        content: "{{ vault_cs_tunnel_private_key | trim }}\n"
        dest: "{{ remote_deploy_base }}/secrets/cs_tunnel_key"
        owner: "10001"
        group: "10001"
        mode: '0400'
      no_log: true
