---
# ============================================================
# Sentinel Engram — Playbook 05 — Nginx Reverse Proxy with SSL
# ============================================================
# Purpose:    Public (LAN) entry point for:
#               https://cortex.<suffix>  → Synapse HTTP API (+ /api/v1/mcp)
#               https://neo4j.<suffix>   → Neo4j Browser + Bolt/WebSocket
#             <suffix> = engram.local (dev) / engram.prod (prod).
#
# Depends on: 04.2 (network + upstream containers), vault_<svc>_cert /
#             vault_<svc>_key in vault.yml for every service below.
#
# DNS: add both hostnames to Pi-hole Local DNS on the Cyber Sentinel
#      host (pointing at this host's ansible_host) so n8n on the Pi
#      and browsers on the LAN resolve them.
#
# NOTE: `name` must use underscores/letters only (vault var lookup).
# ============================================================

- name: 05 - Deploy Nginx Reverse Proxy with SSL
  hosts: all_servers
  become: yes

  vars:
    services:
      - { name: "cortex", port: 4443, internal_host: "engram-cortex", template: "nginx_cortex.conf.j2" }
      - { name: "neo4j",  port: 7474, bolt_port: 7687, internal_host: "engram-neo4j", template: "nginx_neo4j.conf.j2" }

  tasks:
    # ============================================================
    # SECTION 1 — TLS material
    # ============================================================

    - name: "[05.1.1] Assert cert/key pairs exist for each service"
      ansible.builtin.assert:
        that:
          - lookup('vars', 'vault_' + item.name + '_cert', default='') | length > 0
          - lookup('vars', 'vault_' + item.name + '_key',  default='') | length > 0
        fail_msg: "Missing vault_{{ item.name }}_cert / vault_{{ item.name }}_key in vault.yml."
        quiet: true
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "[05.1.2] Save TLS certificates (.crt)"
      ansible.builtin.copy:
        content: "{{ lookup('vars', 'vault_' + item.name + '_cert') }}"
        dest: "{{ remote_deploy_base }}/config/nginx/certs/{{ item.name }}.crt"
        owner: "{{ deployment_user }}"
        mode: '0600'
      loop: "{{ services }}"
      no_log: true
      register: certs_changed

    - name: "[05.1.3] Save TLS private keys (.key)"
      ansible.builtin.copy:
        content: "{{ lookup('vars', 'vault_' + item.name + '_key') }}"
        dest: "{{ remote_deploy_base }}/config/nginx/certs/{{ item.name }}.key"
        owner: "{{ deployment_user }}"
        mode: '0600'
      loop: "{{ services }}"
      no_log: true
      register: keys_changed

    # ============================================================
    # SECTION 2 — Server blocks
    # ============================================================

    - name: "[05.2.1] Render Nginx server block for each service"
      ansible.builtin.template:
        src: "templates/{{ item.template }}"
        dest: "{{ remote_deploy_base }}/config/nginx/conf.d/{{ item.name }}.conf"
        owner: "{{ deployment_user }}"
        mode: '0644'
      loop: "{{ services }}"
      loop_control:
        label: "{{ item.name }}"
      register: vhosts_changed

    # ============================================================
    # SECTION 3 — Proxy container
    # ------------------------------------------------------------
    # Image pinned by digest (Cyber Sentinel uses nginx:latest here).
    # Recreated only when certs or vhosts changed.
    # ============================================================

    - name: "[05.3.1] Run Nginx reverse proxy container"
      community.docker.docker_container:
        name: engram-nginx
        image: "{{ image_nginx }}"
        state: started
        recreate: "{{ certs_changed.changed or keys_changed.changed or vhosts_changed.changed }}"
        restart_policy: always
        memory: "{{ mem_limit_nginx }}"
        networks:
          - name: "{{ engram_network_name }}"
            ipv4_address: "{{ engram_ip_nginx }}"
        volumes:
          - "{{ remote_deploy_base }}/config/nginx/conf.d:/etc/nginx/conf.d:ro"
          - "{{ remote_deploy_base }}/config/nginx/certs:/etc/nginx/certs:ro"
        ports:
          - "443:443"
          - "80:80"

    - name: "[05.3.2] Validate Nginx configuration inside container"
      ansible.builtin.command: docker exec engram-nginx nginx -t
      changed_when: false
