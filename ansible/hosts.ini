# ============================================================
# Sentinel Engram — Ansible Inventory
# ============================================================
# Purpose:    Target hosts for Sentinel Engram (CTI knowledge graph:
#             Vertex Synapse Cortex + Neo4j + sync worker).
#
# Conventions (mirrors Cyber Sentinel):
#   - Production runs on ZimaBoard 2 (engram-prod group).
#   - Dev runs on a Proxmox VM (engram-dev group). Every dev deploy
#     starts from a clean VM restored from backup (restore_proxmox.yml).
#   - `all_servers` is the parent group used by every Engram playbook.
#   - `cs_sources` are the Cyber Sentinel hosts Engram READS from.
#     They are NOT part of all_servers — only playbook 07 touches
#     them, and only to grant read access (SQL views + SSH tunnel user).
#
# Usage:
#   - Deploy to ZimaBoard:        ansible-playbook 00_main.yml --limit engram-prod
#   - Deploy to dev VM:           ansible-playbook 00_main.yml --limit engram-dev
#   - Grant CS access (prod):     ansible-playbook 07_cs_source_access.yml --limit cs_rpi5
#   - Grant CS access (dev):      ansible-playbook 07_cs_source_access.yml --limit cs_dev_vm
#
# IP addresses of engram hosts below are placeholders — set them to
# the real DHCP reservations before the first run.
# ============================================================

# ------------------------------------------------------------
# [HOSTS.PROD] Production — ZimaBoard 2 (Intel N150, 8 GB, x86_64)
# ------------------------------------------------------------
# Not always-on: powered for a few hours per day. The sync timer
# (playbook 06) catches up on every boot.
# ------------------------------------------------------------
[engram-prod]
zima ansible_host=192.168.0.20 ansible_user=hunter

# ------------------------------------------------------------
# [HOSTS.DEV] Development — Proxmox VM (x86_64, Debian)
# ------------------------------------------------------------
[engram-dev]
engram_dev_vm ansible_host=192.168.0.21 ansible_user=hunter

# ------------------------------------------------------------
# [HOSTS.PARENT] Aggregate group used by all Engram playbooks
# ------------------------------------------------------------
[all_servers:children]
engram-prod
engram-dev

# ------------------------------------------------------------
# [HOSTS.CS] Cyber Sentinel data sources (read-only integration)
# ------------------------------------------------------------
# Same hosts as in the Cyber Sentinel inventory. Mapping:
#   zima          -> cs_rpi5    (host_vars/zima/vars.yml)
#   engram_dev_vm -> cs_dev_vm  (host_vars/engram_dev_vm/vars.yml)
# ------------------------------------------------------------
[cs_sources]
cs_rpi5   ansible_host=192.168.0.2 ansible_user=hunter
cs_dev_vm ansible_host=192.168.0.5 ansible_user=hunter
