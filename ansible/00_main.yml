---
# ============================================================
# Sentinel Engram — Playbook 00 — Master Orchestrator
# ============================================================
# Purpose:    Deploys the full Sentinel Engram stack (Synapse Cortex,
#             Neo4j, Nginx, sync worker) in dependency order.
#
# Depends on: hosts.ini, group_vars/all/vault.yml (ansible-vault),
#             .vault_pass. Cyber Sentinel read access (playbook 07)
#             is a SEPARATE run against the cs_sources hosts — it is
#             not imported here because it targets another project's
#             hosts.
#
# Usage:
#   ansible-playbook 00_main.yml --limit engram-dev    # Proxmox dev VM
#   ansible-playbook 00_main.yml --limit engram-prod   # ZimaBoard 2
#
# Every sub-playbook is idempotent — re-running 00_main.yml is safe.
# ============================================================

# ------------------------------------------------------------
# [00.0] Stage 0 — Pre-deployment (DEV only)
# ------------------------------------------------------------
# Self-skips unless --limit targets engram-dev / engram_dev_vm.
# ------------------------------------------------------------
- import_playbook: restore_proxmox.yml           # [00.0.1] Restore dev VM from latest backup

# ------------------------------------------------------------
# [00.1] Stage 1 — Foundation
# ------------------------------------------------------------
- import_playbook: 01_setup_secrets.yml          # [00.1.1] .env + tunnel key from ansible-vault
- import_playbook: 02_setup_security.yml         # [00.1.2] UFW: 22, 80, 443 only
- import_playbook: 03_setup_system.yml           # [00.1.3] Docker, sysctl for LMDB, storage checks

# ------------------------------------------------------------
# [00.2] Stage 2 — Core stack
# ------------------------------------------------------------
- import_playbook: 04_1_prepare_stack.yml        # [00.2.1] Directories, compose, worker sources
- import_playbook: 04_2_deploy_containers.yml    # [00.2.2] docker compose up (cortex, neo4j)
- import_playbook: 04_3_init_cortex.yml          # [00.2.3] Synapse users, rules, n8n API key
- import_playbook: 04_4_init_neo4j.yml           # [00.2.4] Neo4j constraints + indexes

# ------------------------------------------------------------
# [00.3] Stage 3 — Edge + automation
# ------------------------------------------------------------
- import_playbook: 05_deploy_proxy.yml           # [00.3.1] Nginx: cortex.<sfx>, neo4j.<sfx>
- import_playbook: 06_setup_sync.yml             # [00.3.2] systemd timer + first sync run
