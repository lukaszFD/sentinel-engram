# ============================================================
# Sentinel Engram — Ansible Configuration
# ============================================================
# Same model as Cyber Sentinel: inventory next to this file,
# ansible-vault password file for group_vars/all/vault.yml.
# ============================================================

[defaults]
inventory = hosts.ini

# Lab VMs are rebuilt often (dev VM restored from backup on every
# dev deploy) — host key prompts would block every run.
host_key_checking = False

interpreter_python = auto_silent

# Relative path: works from any clone location, unlike the absolute
# path used in Cyber Sentinel's ansible.cfg.
vault_password_file = .vault_pass
